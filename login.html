<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <a class="auth-brand" href="login.html">Expense Tracker</a>
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Login first to open your tracker.</h1>
      <p class="auth-copy">Your expenses stay saved on this device, even after you logout.</p>

      <form id="login-form" class="auth-form">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" autocomplete="email" placeholder="you@example.com" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" placeholder="Enter your password" required>

        <p class="auth-message" id="auth-message" aria-live="polite"></p>

        <button class="primary-btn" type="submit">Login</button>
      </form>

      <p class="auth-switch">Do not have an account? <a href="register.html">Create one</a></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
