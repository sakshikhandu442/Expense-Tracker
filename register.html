<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="register-title">
      <a class="auth-brand" href="login.html">Expense Tracker</a>
      <p class="eyebrow">Create account</p>
      <h1 id="register-title">Register to start tracking.</h1>
      <p class="auth-copy">This project saves your account and expense records locally in this browser.</p>

      <form id="register-form" class="auth-form">
        <label for="register-name">Full Name</label>
        <input type="text" id="register-name" autocomplete="name" placeholder="Your name" required>

        <label for="register-email">Email Address</label>
        <input type="email" id="register-email" autocomplete="email" placeholder="you@example.com" required>

        <label for="register-password">Password</label>
        <input type="password" id="register-password" autocomplete="new-password" placeholder="Create a password" required>

        <label for="register-confirm">Confirm Password</label>
        <input type="password" id="register-confirm" autocomplete="new-password" placeholder="Repeat password" required>

        <p class="auth-message" id="auth-message" aria-live="polite"></p>

        <button class="primary-btn" type="submit">Register</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
