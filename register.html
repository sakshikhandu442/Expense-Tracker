
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Expense Tracker Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(
135deg,
#0f172a,
#1e1b4b,
#312e81,
#2563eb
);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.register-container{
width:100%;
max-width:1200px;
display:grid;
grid-template-columns:1fr 1fr;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 40px rgba(0,0,0,.4);
}

/* LEFT PANEL */

.left-panel{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:50px;
background:rgba(255,255,255,.05);
}

.left-panel img{
width:320px;
max-width:100%;
}

.left-panel h1{
margin-top:20px;
color:white;
font-size:42px;
text-align:center;
}

.left-panel p{
margin-top:15px;
color:#cbd5e1;
text-align:center;
}

/* RIGHT PANEL */

.right-panel{
padding:50px;
}

.right-panel h2{
font-size:35px;
color:white;
margin-bottom:10px;
}

.right-panel p{
color:#cbd5e1;
margin-bottom:25px;
}

.input-group{
position:relative;
margin-bottom:18px;
}

.input-group input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:12px;
font-size:15px;
}

.password-toggle{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#64748b;
}

.register-btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#38bdf8;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

.register-btn:hover{
background:#0ea5e9;
}

/* PASSWORD STRENGTH */

.strength{
height:8px;
background:#334155;
border-radius:20px;
margin-bottom:20px;
overflow:hidden;
}

.strength-bar{
height:100%;
width:0%;
background:#22c55e;
transition:.3s;
}

/* SOCIAL */

.divider{
text-align:center;
color:white;
margin:25px 0;
}

.social{
display:flex;
gap:15px;
}

.social button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.google{
background:white;
}

.github{
background:#111827;
color:white;
}

.login-link{
margin-top:20px;
text-align:center;
color:white;
}

.login-link a{
color:#38bdf8;
text-decoration:none;
}

/* MOBILE */

@media(max-width:900px){

.register-container{
grid-template-columns:1fr;
}

.left-panel{
display:none;
}

}

</style>
</head>

<body>

<div class="register-container">

<div class="left-panel">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h1>Join Expense Tracker Pro</h1>

<p>
Create an account and start managing your finances smarter.
</p>

</div>

<div class="right-panel">

<h2>Create Account</h2>

<p>
Fill in your details to get started.
</p>

<form>

<div class="input-group">
<input
type="text"
placeholder="Full Name"
required>
</div>

<div class="input-group">
<input
type="email"
placeholder="Email Address"
required>
</div>

<div class="input-group">
<input
type="text"
placeholder="Username"
required>
</div>

<div class="input-group">
<input
type="password"
id="password"
placeholder="Password"
onkeyup="checkStrength()"
required>

<i
class="fas fa-eye password-toggle"
onclick="togglePassword('password')">
</i>
</div>

<div class="strength">
<div class="strength-bar"
id="strengthBar"></div>
</div>

<div class="input-group">
<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<i
class="fas fa-eye password-toggle"
onclick="togglePassword('confirmPassword')">
</i>
</div>

<button
type="submit"
class="register-btn">
Create Account
</button>

</form>

<div class="divider">
──────── OR ────────
</div>

<div class="social">

<button class="google">
<i class="fab fa-google"></i>
 Google
</button>

<button class="github">
<i class="fab fa-github"></i>
 GitHub
</button>

</div>

<div class="login-link">

Already have an account?

<a href="login.html">
Login Here
</a>

</div>

</div>

</div>

<script>

function togglePassword(id){

const input =
document.getElementById(id);

if(input.type==="password"){
input.type="text";
}
else{
input.type="password";
}

}

function checkStrength(){

let password =
document.getElementById("password").value;

let bar =
document.getElementById("strengthBar");

if(password.length < 4){

bar.style.width="25%";
bar.style.background="red";

}
else if(password.length < 8){

bar.style.width="60%";
bar.style.background="orange";

}
else{

bar.style.width="100%";
bar.style.background="limegreen";

}

}
localStorage.setItem(
"user",
JSON.stringify({
fullname,
email,
username,
password
})
);
</script>

</body>
</html>
